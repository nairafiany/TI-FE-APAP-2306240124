name: Deploy FE (VehicleRental)

on:
  push:
    branches:
      - feat/praktikum-9

env:
  DOCKER_IMAGE_NAME: ${{ secrets.TI_FE_DOCKER_IMAGE }}
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USER: ${{ secrets.EC2_USER }}
  VITE_API_URL: ${{ secrets.VITE_API_URL }}

jobs:
  # ============================
  # BUILD JOB
  # ============================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build FE (Vite)
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: fe-artifacts
          path: |
            dist
            Dockerfile
            nginx.conf
            k8s/

  # ============================
  # DOCKER BUILD & PUSH
  # ============================
  docker-push:
    runs-on: ubuntu-latest
    needs: build

    env:
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Download artifacts from build job
        uses: actions/download-artifact@v3
        with:
          name: fe-artifacts

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }} \
            -t $DOCKER_IMAGE_NAME:${{ env.IMAGE_TAG }} .

      - name: Push Docker Image
        run: docker push $DOCKER_IMAGE_NAME:${{ env.IMAGE_TAG }}

  # ============================
  # DEPLOY TO EC2 + K3S
  # ============================
  deploy:
    runs-on: ubuntu-latest
    needs: docker-push

    env:
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          name: fe-artifacts

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts

      - name: Replace tag in deployment.yaml
        run: |
          sed "s|REPLACE_ME_TAG|${IMAGE_TAG}|g" k8s/deployment.yaml > deployment.yaml

      - name: Upload Kubernetes files via SCP
        run: |
          ssh $EC2_USER@$EC2_HOST "mkdir -p ~/app/vehiclerental-fe/k8s"
          scp deployment.yaml k8s/service.yaml k8s/ingress.yaml \
              $EC2_USER@$EC2_HOST:~/app/vehiclerental-fe/k8s/

      - name: Apply to K3s on EC2
        run: |
          ssh $EC2_USER@$EC2_HOST "
            sudo k3s kubectl apply -f ~/app/vehiclerental-fe/k8s/ &&
            sudo k3s kubectl rollout status deployment/vehiclerental-fe -n default
          "
