server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # =========================================
    # 1. SPA Routing (Agar refresh page tidak 404)
    # =========================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # =========================================
    # 2. REVERSE PROXY (SOLUSI CORS)
    # =========================================
    # Setiap request yang diawali "/apiwilayah/" akan diteruskan ke "https://wilayah.id/"
    location /apiwilayah/ {
        # Tanda slash (/) di ujung url https://wilayah.id/ SANGAT PENTING.
        # Ini gunanya untuk membuang kata "/apiwilayah" sebelum dikirim ke server sana.
        proxy_pass https://wilayah.id/;

        # Settingan wajib untuk HTTPS (SSL SNI)
        proxy_ssl_server_name on;
        
        # Menipu server sana agar mengira request datang langsung ke domain mereka
        proxy_set_header Host wilayah.id;
        
        # Meneruskan IP asli
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================
    # 3. Gzip Compression (Optimasi)
    # =========================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # =========================================
    # 4. Cache Static Assets (Gambar/Font/JS)
    # =========================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}